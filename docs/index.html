<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michelle Rogers Executive</title>
<style>
  :root{--bg:#0b0e13;--panel:#141922;--line:#232b38;--text:#e6ecf5;--dim:#8b98ac;--accent:#5b9dff;--good:#3fbf7f;--warn:#e0a13a}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:15px;margin:0;letter-spacing:.02em}
  h1 span{color:var(--dim);font-weight:400}
  main{padding:20px;max-width:1080px;margin:0 auto;display:grid;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 12px}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .metric b{display:block;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .metric small{color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  input,select,textarea,button{font:inherit;color:var(--text);background:#0f141c;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  input:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  button{cursor:pointer;background:#1b2431}
  button.primary{background:var(--accent);color:#04101f;border-color:transparent;font-weight:600}
  button.link{background:none;border:none;color:var(--dim);padding:4px 0;text-align:left}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--dim);font-size:13px}
  .err{color:#ff8b8b;font-size:13px;white-space:pre-wrap}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .tag.ok{color:var(--good);border-color:#245}
  #gate{max-width:420px;margin:9vh auto;padding:0 20px}
  #gate .card{display:grid;gap:12px}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 4px;max-width:1080px;margin:0 auto}
  nav button{font-size:13px;padding:6px 11px}
  nav button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
  .hide{display:none!important}
  @media(max-width:620px){th:nth-child(n+3),td:nth-child(n+3){display:none}}
</style>
</head>
<body>

<header>
  <h1>Michelle Rogers <span>Executive</span></h1>
  <div class="row">
    <span id="whoami" class="muted"></span>
    <button id="signout" class="hide">Sign out</button>
  </div>
</header>

<section id="gate">
  <div class="card">
    <div class="muted" id="gateNote">Executive access. Sign in with your authorized owner email.</div>
    <div id="setpw" class="hide">
      <label class="muted" for="newpw">Choose a password for this account</label>
      <input id="newpw" type="password" autocomplete="new-password" placeholder="At least 10 characters">
      <div class="row" style="margin-top:8px"><button id="savepw" class="primary">Save password</button></div>
    </div>
    <div id="signin">
      <label class="muted" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
      <label class="muted" for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      <div class="row" style="margin-top:10px">
        <button id="login" class="primary">Sign in</button>
        <button id="magic">Email me a sign-in link</button>
      </div>
    </div>
    <div id="gateMsg" class="err"></div>
  </div>
</section>

<nav id="tabs" class="hide"></nav>
<main id="app" class="hide"></main>

<script type="module">
const CFG = {
  supabaseUrl: "https://bimmfmydbmooarobilsq.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpbW1mbXlkYm1vb2Fyb2JpbHNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NjE5MjksImV4cCI6MjExMTEzNzkyOX0.U716FAEBnA8-TsZj8694zt1hjVB9Nm6khHJxnrsD-q4"
};
const INITIAL_HASH = new URLSearchParams(location.hash.replace(/^#/, ""));
const INITIAL_TYPE = INITIAL_HASH.get("type");
const INITIAL_ERR = INITIAL_HASH.get("error_description");
const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
const sb = createClient(CFG.supabaseUrl, CFG.anonKey, { auth: { detectSessionInUrl: true, persistSession: true } });

const $ = (s) => document.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
};
const money = (n) => n == null ? "not set" : "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
const day = (d) => d ? new Date(d).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const esc = (s) => String(s ?? "");

let session = null, me = null, role = null;
const workerUrl = "https://executive-agent-research.michelle-rogers-executive.workers.dev";

function msg(t) { $("#gateMsg").textContent = t || ""; }

async function loadIdentity() {
  me = session.user;
  const { data } = await sb.from("executive_memberships").select("role,active").eq("user_id", me.id).maybeSingle();
  role = data?.active ? data.role : null;
  $("#whoami").textContent = (me.email || me.id) + (role ? " · " + role : " · no executive role");
  return role;
}

async function boot() {
  if (INITIAL_ERR) msg("That link could not be used: " + INITIAL_ERR.replace(/\+/g, " "));
  const { data } = await sb.auth.getSession();
  session = data.session;
  const type = INITIAL_TYPE;
  if (session && (type === "invite" || type === "recovery")) {
    $("#setpw").classList.remove("hide");
    $("#signin").classList.add("hide");
    $("#gateNote").textContent = "Your email is confirmed. Set a password to finish.";
    $("#gate").classList.remove("hide");
    history.replaceState(null, "", location.pathname + location.search);
    return;
  }
  if (!session) return;
  await enter();
}

async function enter() {
  await loadIdentity();
  if (!role) {
    msg("Your account has no active executive membership. Contact the project owner.");
    $("#signout").classList.remove("hide");
    return;
  }
  $("#gate").classList.add("hide");
  $("#signout").classList.remove("hide");
  $("#tabs").classList.remove("hide");
  $("#app").classList.remove("hide");
  buildTabs();
  render("overview");
}

$("#login").onclick = async () => {
  msg("");
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pw").value });
  if (error) return msg(error.message);
  const { data } = await sb.auth.getSession(); session = data.session; await enter();
};
$("#magic").onclick = async () => {
  msg("");
  const email = $("#email").value.trim();
  if (!email) return msg("Enter your email first.");
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  msg(error ? error.message : "Sign-in link sent. Open it on this device.");
};
$("#savepw").onclick = async () => {
  msg("");
  const pw = $("#newpw").value;
  if (pw.length < 10) return msg("Use at least 10 characters.");
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) return msg(error.message);
  $("#setpw").classList.add("hide"); $("#signin").classList.remove("hide");
  await loadIdentity(); await enter();
};
$("#signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

const TABS = [
  ["overview", "Overview"], ["funding", "Funding"], ["tasks", "Tasks"],
  ["agents", "Agents"], ["knowledge", "Knowledge"], ["research", "Research"],
  ["schedule", "Schedule"], ["awards", "Awards"], ["judging", "Judging"],
  ["certified", "Certified"], ["documents", "Documents"], ["account", "Account"]
];
function buildTabs() {
  const nav = $("#tabs"); nav.textContent = "";
  for (const [id, label] of TABS) {
    nav.append(el("button", { text: label, "aria-selected": String(id === "overview"), onclick: () => render(id) }));
  }
}
function render(id) {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.textContent === (TABS.find(t => t[0] === id) || [])[1])));
  const app = $("#app"); app.textContent = "";
  ({ overview, funding, tasks, agents, knowledge, research, schedule, awards, judging, certified, documents, account }[id] || overview)(app);
}
function card(title, kids) { return el("div", { class: "card" }, [el("h2", { text: title }), ...[].concat(kids)]); }
function table(headers, rows, empty) {
  if (!rows.length) return el("div", { class: "muted", text: empty || "Nothing recorded yet." });
  const t = el("table");
  t.append(el("tr", {}, headers.map(h => el("th", { text: h }))));
  for (const r of rows) t.append(el("tr", {}, r.map(c => el("td", {}, c))));
  return t;
}
function fail(node, e) { node.append(el("div", { class: "err", text: "Could not load: " + (e.message || e) })); }

async function overview(app) {
  const c = card("Executive position", el("div", { class: "metrics" }, [
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "verified received" })]),
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "open tasks" })]),
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "knowledge entries" })]),
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "open opportunities" })])
  ]));
  app.append(c);
  const [{ data: fr }, { data: tk, count: taskCount }, { data: kn, count: kCount }, { data: op, count: oCount }] =
    await Promise.all([
      sb.schema("executive").from("funding_received").select("*").maybeSingle(),
      sb.schema("executive").from("tasks").select("id", { count: "exact" }).neq("status", "done"),
      sb.schema("executive").from("knowledge").select("id", { count: "exact" }).limit(1),
      sb.from("executive_opportunities").select("id", { count: "exact" }).not("status", "in", "(funded,rejected,expired)")
    ]);
  const vals = [money(fr?.verified_received_usd ?? 0), taskCount ?? 0, kCount ?? 0, oCount ?? 0];
  c.querySelectorAll(".metric b").forEach((b, i) => b.textContent = vals[i]);
  app.append(el("div", { class: "muted", text: "Objective: $450,000 in verified, received capital. Only cleared funds are counted." }));
}

async function funding(app) {
  const box = card("Funding", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const [{ data: rec }, { data: pipe, error: pe }, { data: opps, error: oe }] = await Promise.all([
    sb.schema("executive").from("funding_received").select("*").maybeSingle(),
    sb.schema("executive").from("funding_pipeline").select("*"),
    sb.from("executive_opportunities").select("title,organization,category,status,amount_estimate,amount_verified,currency,deadline_at,source_url").order("deadline_at", { ascending: true, nullsFirst: false }).limit(50)
  ]);
  box.textContent = ""; box.append(el("h2", { text: "Funding" }));
  box.append(el("div", { class: "metrics" }, [
    el("div", { class: "metric" }, [el("b", { text: money(rec?.verified_received_usd ?? 0) }), el("small", { text: "verified received" })]),
    el("div", { class: "metric" }, [el("b", { text: money(450000 - Number(rec?.verified_received_usd ?? 0)) }), el("small", { text: "remaining to objective" })])
  ]));
  if (pe) fail(box, pe);
  if (pipe?.length) box.append(table(["stage", "commitments", "amount"], pipe.map(p => [p.stage, p.commitments, money(p.total_amount)])));
  const h = el("h2", { text: "Opportunities" }); h.style.marginTop = "18px"; box.append(h);
  if (oe) fail(box, oe);
  else box.append(table(["opportunity", "funder", "type", "status", "amount", "deadline"],
    (opps || []).map(o => [
      o.source_url ? el("a", { href: o.source_url, target: "_blank", rel: "noopener", text: o.title, style: "color:var(--accent)" }) : o.title,
      esc(o.organization), esc(o.category), esc(o.status),
      o.amount_verified ? money(o.amount_verified) : (o.amount_estimate ? "~" + money(o.amount_estimate) : ""),
      day(o.deadline_at)
    ]), "No opportunities recorded yet."));

  const form = el("div", { class: "row", style: "margin-top:14px" }, [
    el("input", { id: "oTitle", placeholder: "Opportunity title" }),
    el("input", { id: "oOrg", placeholder: "Funder" }),
    el("select", { id: "oCat" }, [["grant", "grant"], ["investment", "investment"], ["sponsorship", "sponsorship"], ["partnership", "partnership"], ["other", "other"]].map(([v, t]) => el("option", { value: v, text: t }))),
    el("button", { class: "primary", text: "Add", onclick: async () => {
      const title = $("#oTitle").value.trim(); if (!title) return;
      const { error } = await sb.from("executive_opportunities").insert({ title, organization: $("#oOrg").value.trim() || null, category: $("#oCat").value, created_by: me.id });
      if (error) return alert(error.message);
      render("funding");
    } })
  ]);
  box.append(el("div", { class: "muted", text: "Add an opportunity" }), form);
}

async function tasks(app) {
  const box = card("Tasks", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const { data, error } = await sb.schema("executive").from("tasks").select("id,title,status,priority,owner_agent,due_at").order("priority").limit(100);
  box.textContent = ""; box.append(el("h2", { text: "Tasks" }));
  if (error) fail(box, error);
  else box.append(table(["task", "owner", "status", "priority", "due"],
    (data || []).map(t => [t.title, esc(t.owner_agent || "unassigned"), t.status, t.priority, day(t.due_at)]), "No tasks yet."));
  const canWrite = role && ["owner", "admin", "researcher"].includes(role);
  if (canWrite) {
    const form = el("div", { class: "row", style: "margin-top:14px" }, [
      el("input", { id: "tTitle", placeholder: "New task" }),
      el("input", { id: "tOwner", placeholder: "Owner agent" }),
      el("button", { class: "primary", text: "Add", onclick: async () => {
        const title = $("#tTitle").value.trim(); if (!title) return;
        const { error } = await sb.schema("executive").from("tasks").insert({ title, owner_agent: $("#tOwner").value.trim() || null });
        if (error) return alert(error.message);
        render("tasks");
      } })
    ]);
    box.append(el("div", { class: "muted", text: "Add a task" }), form);
  }
}

async function knowledge(app) {
  const box = card("Knowledge", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const { data, error } = await sb.schema("executive").from("knowledge").select("department,topic,title,verification,created_at").order("created_at", { ascending: false }).limit(100);
  box.textContent = ""; box.append(el("h2", { text: "Knowledge" }));
  if (error) fail(box, error);
  else box.append(table(["title", "department", "topic", "evidence"], (data || []).map(k => [k.title, k.department, k.topic, k.verification]), "No knowledge recorded yet."));
}

async function research(app) {
  const box = card("Research", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const { data, error } = await sb.from("executive_research").select("title,kind,source_url,verified,retrieved_at,created_at").order("created_at", { ascending: false }).limit(100);
  box.textContent = ""; box.append(el("h2", { text: "Research" }));
  if (error) fail(box, error);
  else box.append(table(["title", "kind", "verified", "source"],
    (data || []).map(r => [r.title, r.kind, r.verified ? "yes" : "no", r.source_url ? el("a", { href: r.source_url, target: "_blank", rel: "noopener", text: "link", style: "color:var(--accent)" }) : ""]),
    "No research recorded yet."));

  const vault = card("Research vault — agent submissions", el("div", { class: "muted", text: "Loading…" }));
  app.append(vault);
  const [{ data: entries, error: ee }, { data: agentRows }] = await Promise.all([
    sb.schema("executive").from("research_entries").select("id,title,topic,domain,agent_name,status,trust_score,created_at").order("created_at", { ascending: false }).limit(100),
    sb.schema("executive").from("agents").select("id,name").order("name")
  ]);
  vault.textContent = ""; vault.append(el("h2", { text: "Research vault — agent submissions" }));
  if (ee) fail(vault, ee);
  else vault.append(table(["title", "topic", "agent", "status", "trust"],
    (entries || []).map(r => [r.title, esc(r.topic || ""), esc(r.agent_name || ""), r.status, r.trust_score ?? ""]),
    "No research entries filed yet."));
  const canWrite = role && ["owner", "admin", "researcher"].includes(role);
  if (canWrite) {
    vault.append(el("div", { class: "muted", style: "margin-top:14px", text: "File a research entry — the summary is the claim the verifier will check" }));
    vault.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "eTitle", placeholder: "Entry title" }),
      el("input", { id: "eTopic", placeholder: "Topic" }),
      el("select", { id: "eDomain" }, ["technology", "industry", "policy", "other"].map(v => el("option", { value: v, text: v }))),
      el("select", { id: "eAgent" }, [el("option", { value: "", text: "No agent" }), ...(agentRows || []).map(a => el("option", { value: a.id, text: a.name }))])
    ]));
    vault.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "eSummary", placeholder: "Summary — the claim", style: "min-width:320px" }),
      el("button", { class: "primary", text: "File entry", onclick: async () => {
        const title = $("#eTitle").value.trim(); if (!title) return;
        const agentId = $("#eAgent").value || null;
        const agent = (agentRows || []).find(a => a.id === agentId);
        const { error } = await sb.schema("executive").from("research_entries").insert({
          title, topic: $("#eTopic").value.trim() || null, domain: $("#eDomain").value,
          summary: $("#eSummary").value.trim() || null,
          agent_id: agentId, agent_name: agent ? agent.name : null, owner_id: me.id
        });
        if (error) return alert(error.message);
        render("research");
      } })
    ]));
  }
}

async function documents(app) {
  const box = card("Private documents (Cloudflare R2)", [
    el("div", { class: "muted", text: "Connected to the dedicated executive Cloudflare R2 Worker. Authentication uses your current Supabase session." }),
    el("div", { id: "docList", class: "muted", style: "margin-top:12px", text: "Loading…" })
  ]);
  app.append(box);
  const call = (path, opts = {}) => fetch(workerUrl + path, { ...opts, headers: { Authorization: "Bearer " + session.access_token, ...(opts.headers || {}) } });
  try {
    const r = await call("/v1/documents");
    const j = await r.json();
    const list = $("#docList"); list.textContent = "";
    if (!r.ok) { list.className = "err"; list.textContent = j.error || ("HTTP " + r.status); return; }
    list.className = "";
    if (!j.objects?.length) { list.className = "muted"; list.textContent = "No documents stored."; }
    else list.append(table(["name", "size", ""], j.objects.map(o => [o.name, o.size, el("div", {class:"row"}, [
      el("button", { text: "Download", onclick: async () => {
        const rr = await call("/v1/documents/" + encodeURIComponent(o.name));
        if (!rr.ok) return alert("Could not download document");
        const b = await rr.blob(); const uri = URL.createObjectURL(b);
        const a = el("a", { href: uri, download: o.name.split("/").pop() }); a.click();
        setTimeout(() => URL.revokeObjectURL(uri), 60000);
      } }),
      el("button", {text:"Delete", onclick: async () => {
        if (!confirm("Permanently delete " + o.name + "?")) return;
        const rr = await call("/v1/documents/" + encodeURIComponent(o.name), {method:"DELETE"});
        if (!rr.ok) return alert("Could not delete document");
        render("documents");
      }})
    ])])));
    const file = el("input", { type: "file" });
    list.append(el("div", { class: "row", style: "margin-top:12px" }, [file, el("button", { class: "primary", text: "Upload", onclick: async () => {
      const f = file.files[0]; if (!f) return;
      const ext = f.name.split(".").pop().toLowerCase();
      const mime = ({pdf:"application/pdf",txt:"text/plain",md:"text/markdown",markdown:"text/markdown",json:"application/json"})[ext];
      if (!mime) return alert("Supported file formats: PDF, TXT, MD, JSON.");
      const rr = await call("/v1/documents/" + encodeURIComponent(f.name), { method: "PUT", headers: { "content-type": mime }, body: f });
      const jj = await rr.json().catch(() => ({}));
      if (!rr.ok) return alert(jj.error || ("HTTP " + rr.status));
      render("documents");
    } })]));
  } catch (e) { const list = $("#docList"); list.className = "err"; list.textContent = "Worker unreachable from this page: " + e.message; }
}

const canWriteRole = () => role && ["owner", "admin", "researcher"].includes(role);
const canManageRole = () => role && ["owner", "admin"].includes(role);

async function agents(app) {
  const box = card("Agents — registry", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const { data, error } = await sb.schema("executive").from("agents")
    .select("name,role,host,category,status,purpose,runtime,model,submission_count,last_submission_at,is_active")
    .order("sort_order").order("name").limit(100);
  box.textContent = ""; box.append(el("h2", { text: "Agents — registry" }));
  if (error) fail(box, error);
  else box.append(table(["agent", "purpose", "runtime / host", "category", "status", "submissions", "model"],
    (data || []).map(a => [a.name, esc(a.purpose || a.role || ""), esc([a.runtime, a.host].filter(Boolean).join(" · ")), esc(a.category || ""), a.status + (a.is_active === false ? " (chat off)" : ""), a.submission_count ?? 0, esc(a.model || "")]),
    "No agents registered yet."));
  box.append(el("div", { class: "muted", style: "margin-top:10px", text: "Registry entries are the agents that file research (Veritas Version B). An entry may also carry chat configuration (Version A: category, model, system prompt) for agents members can talk to. API keys are never shown or stored here in clear text — only a SHA-256 hash is kept, set outside the console." }));
  if (canWriteRole()) {
    box.append(el("div", { class: "muted", style: "margin-top:14px", text: "Register an agent" }));
    box.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "aName", placeholder: "Agent name" }),
      el("input", { id: "aPurpose", placeholder: "Purpose" }),
      el("input", { id: "aRuntime", placeholder: "Runtime" }),
      el("select", { id: "aCategory" }, [["", "No chat category"], ["executive", "executive"], ["research", "research"], ["compliance", "compliance"], ["evaluation", "evaluation"]].map(([v, t]) => el("option", { value: v, text: t }))),
      el("input", { id: "aModel", placeholder: "Chat model (optional)" })
    ]));
    box.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("textarea", { id: "aPrompt", placeholder: "System prompt (chat configuration, optional)", style: "min-width:420px", rows: "3" }),
      el("button", { class: "primary", text: "Register", onclick: async () => {
        const name = $("#aName").value.trim(); if (!name) return;
        const model = $("#aModel").value.trim();
        const { error } = await sb.schema("executive").from("agents").insert({
          name, purpose: $("#aPurpose").value.trim() || null, runtime: $("#aRuntime").value.trim() || null,
          category: $("#aCategory").value || null, ...(model ? { model } : {}),
          system_prompt: $("#aPrompt").value.trim() || null
        });
        if (error) return alert(error.message);
        render("agents");
      } })
    ]));
  }
}

async function schedule(app) {
  const box = card("Review schedule", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const [{ data, error }, { data: entries }] = await Promise.all([
    sb.schema("executive").from("review_schedules").select("id,entry_id,title,agent_name,due_date,interval_days,status,completed_at").order("due_date").limit(100),
    sb.schema("executive").from("research_entries").select("id,title,agent_name").order("created_at", { ascending: false }).limit(100)
  ]);
  const entryById = Object.fromEntries((entries || []).map(e => [e.id, e]));
  box.textContent = ""; box.append(el("h2", { text: "Review schedule" }));
  if (error) fail(box, error);
  else box.append(table(["entry", "agent", "due", "every (days)", "status"],
    (data || []).map(s => [esc(s.title || entryById[s.entry_id]?.title || ""), esc(s.agent_name || entryById[s.entry_id]?.agent_name || ""), day(s.due_date), s.interval_days, s.completed_at ? "completed" : s.status]),
    "No reviews scheduled yet."));
  if (canWriteRole() && entries?.length) {
    box.append(el("div", { class: "muted", style: "margin-top:14px", text: "Schedule a re-verification" }));
    box.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("select", { id: "sEntry" }, entries.map(e => el("option", { value: e.id, text: e.title }))),
      el("input", { id: "sDue", type: "date" }),
      el("input", { id: "sInterval", type: "number", value: "7", style: "width:90px" }),
      el("button", { class: "primary", text: "Schedule", onclick: async () => {
        const entry = entryById[$("#sEntry").value]; if (!entry) return;
        const due = $("#sDue").value; if (!due) return alert("Pick a due date.");
        const { error } = await sb.schema("executive").from("review_schedules").insert({
          entry_id: entry.id, owner_id: me.id, title: entry.title, agent_name: entry.agent_name,
          due_date: due, interval_days: Number($("#sInterval").value) || 7
        });
        if (error) return alert(error.message);
        render("schedule");
      } })
    ]));
  }
}

async function awards(app) {
  const box = card("Award categories", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const { data: cats, error } = await sb.schema("executive").from("award_categories")
    .select("id,name,tagline,cycle,year,status,total_points").order("sort_order").order("name").limit(100);
  const catById = Object.fromEntries((cats || []).map(c => [c.id, c]));
  box.textContent = ""; box.append(el("h2", { text: "Award categories" }));
  if (error) fail(box, error);
  else box.append(table(["category", "cycle", "status", "points"],
    (cats || []).map(c => [c.name, esc([c.cycle, c.year].filter(Boolean).join(" ")), c.status, c.total_points]),
    "No award categories yet."));
  if (canManageRole()) {
    box.append(el("div", { class: "row", style: "margin-top:14px" }, [
      el("input", { id: "cName", placeholder: "Category name" }),
      el("input", { id: "cSlug", placeholder: "slug" }),
      el("input", { id: "cCycle", placeholder: "Cycle" }),
      el("input", { id: "cYear", type: "number", placeholder: "Year", style: "width:100px" }),
      el("button", { class: "primary", text: "Add category", onclick: async () => {
        const name = $("#cName").value.trim(); if (!name) return;
        const slug = $("#cSlug").value.trim() || name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        const { error } = await sb.schema("executive").from("award_categories").insert({
          name, slug, cycle: $("#cCycle").value.trim() || null,
          year: Number($("#cYear").value) || null
        });
        if (error) return alert(error.message);
        render("awards");
      } })
    ]));
  }

  const nbox = card("Nominations", el("div", { class: "muted", text: "Loading…" }));
  app.append(nbox);
  const { data: subs, error: se } = await sb.schema("executive").from("submissions")
    .select("id,category_id,nominee_name,nominee_type,nominator_name,status,created_at").order("created_at", { ascending: false }).limit(100);
  nbox.textContent = ""; nbox.append(el("h2", { text: "Nominations" }));
  if (se) fail(nbox, se);
  else nbox.append(table(["nominee", "category", "type", "nominator", "status"],
    (subs || []).map(s => [s.nominee_name, esc(catById[s.category_id]?.name || ""), s.nominee_type, esc(s.nominator_name || ""), s.status]),
    "No nominations yet."));
  if (canWriteRole() && cats?.length) {
    nbox.append(el("div", { class: "row", style: "margin-top:14px" }, [
      el("select", { id: "nCat" }, cats.map(c => el("option", { value: c.id, text: c.name }))),
      el("input", { id: "nName", placeholder: "Nominee name" }),
      el("select", { id: "nType" }, ["platform", "business", "individual", "agent", "technology"].map(v => el("option", { value: v, text: v }))),
      el("input", { id: "nBy", placeholder: "Nominator" }),
      el("button", { class: "primary", text: "Nominate", onclick: async () => {
        const nominee = $("#nName").value.trim(); if (!nominee) return;
        const cat = catById[$("#nCat").value];
        const { error } = await sb.schema("executive").from("submissions").insert({
          category_id: cat.id, category_name: cat.name, nominee_name: nominee,
          nominee_type: $("#nType").value, nominator_name: $("#nBy").value.trim() || null,
          summary: $("#nSummary").value.trim() || null
        });
        if (error) return alert(error.message);
        render("awards");
      } })
    ]));
    nbox.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "nSummary", placeholder: "Why this nominee? (summary)", style: "min-width:420px" })
    ]));
  }
}

async function judging(app) {
  if (!canManageRole()) {
    app.append(card("Judging", el("div", { class: "muted", text: "Judging criteria, judgments, and criteria change requests are board data. They are restricted to owner and admin accounts, in the database as well as here." })));
    return;
  }
  const { data: cats } = await sb.schema("executive").from("award_categories").select("id,name").order("sort_order").order("name");
  const catById = Object.fromEntries((cats || []).map(c => [c.id, c]));

  const cbox = card("Judging criteria — board only", el("div", { class: "muted", text: "Loading…" }));
  app.append(cbox);
  const critHost = el("div", { style: "margin-top:12px" });
  async function loadCriteria() {
    critHost.textContent = "";
    const catId = $("#jCat")?.value; if (!catId) return;
    const { data, error } = await sb.schema("executive").from("judging_criteria")
      .select("name,max_points,definition,sort_order").eq("category_id", catId).order("sort_order").limit(100);
    if (error) return fail(critHost, error);
    critHost.append(table(["criterion", "max points", "definition"],
      (data || []).map(c => [c.name, c.max_points, esc(c.definition || "")]), "No criteria for this category yet."));
  }
  cbox.textContent = ""; cbox.append(el("h2", { text: "Judging criteria — board only" }));
  if (!cats?.length) cbox.append(el("div", { class: "muted", text: "Create an award category first." }));
  else {
    cbox.append(el("div", { class: "row" }, [
      el("select", { id: "jCat", onchange: loadCriteria }, cats.map(c => el("option", { value: c.id, text: c.name })))
    ]));
    cbox.append(critHost);
    await loadCriteria();
    cbox.append(el("div", { class: "row", style: "margin-top:14px" }, [
      el("input", { id: "jcName", placeholder: "Criterion name" }),
      el("input", { id: "jcMax", type: "number", value: "25", style: "width:90px" }),
      el("input", { id: "jcDef", placeholder: "Definition", style: "min-width:280px" }),
      el("button", { class: "primary", text: "Add criterion", onclick: async () => {
        const name = $("#jcName").value.trim(); if (!name) return;
        const { error } = await sb.schema("executive").from("judging_criteria").insert({
          category_id: $("#jCat").value, name, max_points: Number($("#jcMax").value) || 25,
          definition: $("#jcDef").value.trim() || null
        });
        if (error) return alert(error.message);
        render("judging");
      } })
    ]));
  }

  const jbox = card("Judgments — board only", el("div", { class: "muted", text: "Loading…" }));
  app.append(jbox);
  const [{ data: judgments, error: je }, { data: subs }] = await Promise.all([
    sb.schema("executive").from("judgments").select("id,submission_id,category_id,recommendation,total_points,max_points,percentage,status,judged_at").order("created_at", { ascending: false }).limit(100),
    sb.schema("executive").from("submissions").select("id,nominee_name").limit(200)
  ]);
  const subById = Object.fromEntries((subs || []).map(s => [s.id, s]));
  jbox.textContent = ""; jbox.append(el("h2", { text: "Judgments — board only" }));
  if (je) fail(jbox, je);
  else jbox.append(table(["nominee", "category", "recommendation", "points", "%", "status", ""],
    (judgments || []).map(j => [
      esc(subById[j.submission_id]?.nominee_name || ""), esc(catById[j.category_id]?.name || ""),
      esc(j.recommendation || ""), j.total_points != null ? (j.total_points + " / " + (j.max_points ?? "")) : "",
      j.percentage ?? "", j.status,
      j.status === "draft" ? el("div", { class: "row" }, [
        el("button", { text: "Approve", onclick: async () => {
          const { error } = await sb.schema("executive").from("judgments").update({ status: "approved" }).eq("id", j.id);
          if (error) return alert(error.message);
          render("judging");
        } }),
        el("button", { text: "Overrule", onclick: async () => {
          const note = prompt("Admin note for the overrule:"); if (note === null) return;
          const { error } = await sb.schema("executive").from("judgments").update({ status: "overridden", admin_note: note }).eq("id", j.id);
          if (error) return alert(error.message);
          render("judging");
        } })
      ]) : ""
    ]), "No judgments yet. Judgments are produced by the judge agent (Phase 2) or recorded by the board."));

  const rbox = card("Criteria change requests — board only", el("div", { class: "muted", text: "Loading…" }));
  app.append(rbox);
  const { data: reqs, error: re } = await sb.schema("executive").from("criteria_change_requests")
    .select("id,criterion_name,current_definition,proposed_definition,purpose,status,created_at").order("created_at", { ascending: false }).limit(100);
  rbox.textContent = ""; rbox.append(el("h2", { text: "Criteria change requests — board only" }));
  if (re) fail(rbox, re);
  else rbox.append(table(["criterion", "proposed change", "purpose", "status", ""],
    (reqs || []).map(r => [
      r.criterion_name, esc(r.proposed_definition || ""), esc(r.purpose || ""), r.status,
      r.status === "pending_review" ? el("div", { class: "row" }, [
        el("button", { text: "Approve", onclick: async () => {
          const { error } = await sb.schema("executive").from("criteria_change_requests").update({ status: "approved", decided_at: new Date().toISOString() }).eq("id", r.id);
          if (error) return alert(error.message);
          render("judging");
        } }),
        el("button", { text: "Reject", onclick: async () => {
          const note = prompt("Admin note (optional):"); if (note === null) return;
          const { error } = await sb.schema("executive").from("criteria_change_requests").update({ status: "rejected", admin_note: note || null, decided_at: new Date().toISOString() }).eq("id", r.id);
          if (error) return alert(error.message);
          render("judging");
        } })
      ]) : ""
    ]), "No change requests. The judge agent must file one here before any criterion definition changes."));
}

async function certified(app) {
  const box = card("Certified register", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const [{ data, error }, { data: cats }] = await Promise.all([
    sb.schema("executive").from("certified_records").select("id,category_name,award_title,recipient_name,recipient_type,seal_serial,status,issued_at").order("issued_at", { ascending: false, nullsFirst: false }).limit(100),
    sb.schema("executive").from("award_categories").select("id,name").order("name")
  ]);
  box.textContent = ""; box.append(el("h2", { text: "Certified register" }));
  if (error) fail(box, error);
  else box.append(table(["recipient", "award", "category", "seal serial", "status", "issued"],
    (data || []).map(r => [r.recipient_name, esc(r.award_title || ""), esc(r.category_name || ""), esc(r.seal_serial || ""), r.status, day(r.issued_at)]),
    "No certified records issued yet."));
  if (canManageRole()) {
    box.append(el("div", { class: "muted", style: "margin-top:14px", text: "Issue a certified record (the seal serial must be unique)" }));
    box.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "rName", placeholder: "Recipient name" }),
      el("input", { id: "rAward", placeholder: "Award title" }),
      el("select", { id: "rCat" }, [el("option", { value: "", text: "No category" }), ...(cats || []).map(c => el("option", { value: c.id, text: c.name }))]),
      el("input", { id: "rSerial", placeholder: "Seal serial" }),
      el("button", { class: "primary", text: "Issue", onclick: async () => {
        const name = $("#rName").value.trim(); if (!name) return;
        const cat = (cats || []).find(c => c.id === $("#rCat").value);
        const { error } = await sb.schema("executive").from("certified_records").insert({
          recipient_name: name, award_title: $("#rAward").value.trim() || null,
          category_id: cat ? cat.id : null, category_name: cat ? cat.name : null,
          seal_serial: $("#rSerial").value.trim() || null,
          citation: $("#rCitation").value.trim() || null,
          status: "issued", issued_at: new Date().toISOString()
        });
        if (error) return alert(error.message);
        render("certified");
      } })
    ]));
    box.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "rCitation", placeholder: "Citation", style: "min-width:420px" })
    ]));
  }
}

async function account(app) {
  const box = card("Account", [
    el("div", { class: "muted", text: "Signed in as " + (me.email || me.id) + (role ? " with role " + role : "") }),
    el("div", { class: "muted", text: "Set a password to sign in without waiting for an emailed link." }),
    el("div", { class: "row", style: "margin-top:12px" }, [
      el("input", { id: "acctPw", type: "password", autocomplete: "new-password", placeholder: "New password (min 10 characters)", style: "min-width:280px" }),
      el("button", { class: "primary", text: "Save password", onclick: async () => {
        const pw = $("#acctPw").value;
        const out = $("#acctMsg");
        out.className = "muted";
        if (pw.length < 10) { out.className = "err"; out.textContent = "Use at least 10 characters."; return; }
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) { out.className = "err"; out.textContent = error.message; return; }
        $("#acctPw").value = "";
        out.textContent = "Password saved. You can sign in with it from now on.";
      } })
    ]),
    el("div", { id: "acctMsg", class: "muted", style: "margin-top:10px" }),
    el("div", { class: "row", style: "margin-top:16px" }, [
      el("button", { text: "Sign out", onclick: async () => { await sb.auth.signOut(); location.reload(); } })
    ])
  ]);
  app.append(box);
}

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") { $("#setpw").classList.remove("hide"); $("#gate").classList.remove("hide"); }
});
await boot();
</script>
</body>
</html>
