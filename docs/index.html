<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michelle Rogers Executive</title>
<style>
  :root{--bg:#0b0e13;--panel:#141922;--panel2:#0f141c;--line:#232b38;--text:#e6ecf5;--dim:#8b98ac;--accent:#5b9dff;--good:#3fbf7f;--warn:#e0a13a;--bad:#ff8b8b}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:15px;margin:0;letter-spacing:.02em}
  h1 span{color:var(--dim);font-weight:400}
  main{padding:18px;max-width:1120px;margin:0 auto;display:grid;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 12px}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 10px}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .metric b{display:block;font-size:24px;font-weight:600;letter-spacing:-.01em}
  .metric small{color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
  input:focus,textarea:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  button{cursor:pointer;background:#1b2431}
  button.primary{background:var(--accent);color:#04101f;border-color:transparent;font-weight:600}
  button.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
  button.mini{padding:3px 7px;font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--dim);font-size:13px}
  .err{color:var(--bad);font-size:13px;white-space:pre-wrap}
  .ok{color:var(--good);font-size:13px}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .tag.hot{color:var(--warn);border-color:#4a3a18}
  .tag.done{color:var(--good);border-color:#204a34}
  #gate{max-width:420px;margin:9vh auto;padding:0 18px}
  #gate .card{display:grid;gap:10px}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px;max-width:1120px;margin:0 auto}
  nav button{font-size:13px;padding:6px 11px}
  nav button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
  .hide{display:none!important}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  @media(max-width:620px){th:nth-child(n+4),td:nth-child(n+4){display:none}}
  #printArea{display:none}
  @media print{
    header,nav,main,#gate{display:none!important}
    body{background:#fff}
    #printArea{display:block;color:#000;font:14px/1.55 Georgia,"Times New Roman",serif;padding:28px}
    #printArea h1{font-size:24px;letter-spacing:0;color:#000;text-align:center}
    #printArea h2{font-size:16px;color:#000;text-transform:none;letter-spacing:0}
    #printArea table{font-size:13px}
    #printArea th,#printArea td{border-bottom:1px solid #999;color:#000}
    #printArea .seal{width:128px;height:128px;border:3px double #000;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;margin:8px auto 18px;padding:12px}
    #printArea .cert-name{font-size:26px;font-weight:700;text-align:center}
    #printArea .center{text-align:center}
  }
</style>
</head>
<body>

<header>
  <h1>Michelle Rogers <span>Executive</span></h1>
  <div class="row"><span id="whoami" class="muted"></span><button id="signout" class="hide ghost">Sign out</button></div>
</header>

<section id="gate">
  <div class="card">
    <div class="muted" id="gateNote">Executive access. Sign in with your authorized owner email.</div>
    <div id="setpw" class="hide">
      <label class="muted" for="newpw">Choose a password for this account</label>
      <input id="newpw" type="password" autocomplete="new-password" placeholder="At least 10 characters">
      <div class="row" style="margin-top:8px"><button id="savepw" class="primary">Save password</button></div>
    </div>
    <div id="signin">
      <label class="muted" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
      <label class="muted" for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      <div class="row" style="margin-top:10px">
        <button id="login" class="primary">Sign in</button>
        <button id="magic" class="ghost">Email me a sign-in link</button>
      </div>
    </div>
    <div id="gateMsg" class="err"></div>
  </div>
</section>

<nav id="tabs" class="hide"></nav>
<main id="app" class="hide"></main>
<section id="printArea"></section>

<script type="module">
const CFG = { supabaseUrl: "https://bimmfmydbmooarobilsq.supabase.co", anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpbW1mbXlkYm1vb2Fyb2JpbHNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NjE5MjksImV4cCI6MjExMTEzNzkyOX0.U716FAEBnA8-TsZj8694zt1hjVB9Nm6khHJxnrsD-q4" };
const WORKER = "https://executive-agent-research.michelle-rogers-executive.workers.dev";
const INITIAL_HASH = new URLSearchParams(location.hash.replace(/^#/, ""));
const INITIAL_TYPE = INITIAL_HASH.get("type");
const INITIAL_ERR = INITIAL_HASH.get("error_description");

const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
const sb = createClient(CFG.supabaseUrl, CFG.anonKey, { auth: { detectSessionInUrl: true, persistSession: true } });

const $ = (s) => document.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v === undefined || v === null) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "value") n.value = v;
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
};
const money = (n) => n == null || n === "" ? "" : "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
const day = (d) => d ? new Date(d).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const s = (v) => v == null ? "" : String(v);
const days = (d) => Math.ceil((new Date(d) - Date.now()) / 86400000);

let session = null, me = null, role = null, currentTab = "overview";
const canWrite = () => ["owner", "admin", "researcher"].includes(role);
const canManage = () => ["owner", "admin"].includes(role);
const exec = () => sb.schema("executive");

// Worker calls for the Phase 2 routes (verify / judge / chat) use a freshly
// read session token, like executiveDocumentRequest does for documents.
async function workerFetch(path, init = {}) {
  const { data } = await sb.auth.getSession();
  const fresh = data?.session;
  if (fresh) session = fresh;
  const token = fresh?.access_token || session?.access_token;
  if (!token) throw new Error("Executive session expired; please sign in again.");
  return fetch(WORKER + path, { ...init, headers: { Authorization: "Bearer " + token, ...(init.headers || {}) } });
}

// Agent chat state lives only in this page (never persisted); the Worker
// caps the history it forwards by each agent's max_messages.
const chatState = { agentId: null, messages: [] };

// Print views (judge score sheet, seal certificate) render into
// #printArea, which the print stylesheet shows instead of the app.
function printDoc(node) {
  const area = $("#printArea");
  area.textContent = "";
  area.append(node);
  window.print();
}

async function printScoreSheet(judgmentId, subById, catById) {
  const { data: j, error } = await exec().from("judgments").select("*").eq("id", judgmentId).maybeSingle();
  if (error || !j) return alert("Could not load the judgment for printing.");
  const sheet = el("div");
  sheet.append(el("h1", { text: "Judge Score Sheet" }));
  sheet.append(el("p", { text: "Nominee: " + (subById[j.submission_id]?.nominee_name || "") }));
  sheet.append(el("p", { text: "Category: " + (catById[j.category_id]?.name || j.category_id || "") }));
  sheet.append(el("p", { text: "Judged: " + day(j.judged_at || j.created_at) + " · Model: " + (j.model || "") + " · Status: " + j.status }));
  if (j.understanding) sheet.append(el("h2", { text: "Understanding" }), el("p", { text: j.understanding }));
  if (j.assessment) sheet.append(el("h2", { text: "Assessment" }), el("p", { text: j.assessment }));
  const scores = Array.isArray(j.criteria_scores) ? j.criteria_scores : [];
  if (scores.length) {
    const t = el("table");
    t.append(el("tr", {}, ["Criterion", "Score", "Rationale"].map(h => el("th", { text: h }))));
    for (const s of scores) t.append(el("tr", {}, [
      el("td", { text: s.criterion_name || s.criterion_id || "" }),
      el("td", { text: (s.score ?? "") + (s.max_points != null ? " / " + s.max_points : "") }),
      el("td", { text: s.rationale || "" })
    ]));
    sheet.append(el("h2", { text: "Criteria scores" }), t);
  }
  sheet.append(el("p", { text: "Total: " + (j.total_points ?? "") + " / " + (j.max_points ?? "") + " (" + (j.percentage ?? "") + "%)" }));
  sheet.append(el("p", { text: "Recommendation: " + (j.recommendation || "") }));
  if (j.admin_note) sheet.append(el("p", { text: "Admin note: " + j.admin_note }));
  printDoc(sheet);
}

async function printCertificate(recordId) {
  const { data: r, error } = await exec().from("certified_records").select("*").eq("id", recordId).maybeSingle();
  if (error || !r) return alert("Could not load the certified record for printing.");
  if (r.status !== "issued") return alert("Only issued records have a seal certificate.");
  const cert = el("div");
  cert.append(el("div", { class: "seal", text: "SIGIL · SEALED" }));
  cert.append(el("h1", { text: "Certificate of Certification" }));
  if (r.award_title) cert.append(el("p", { class: "center", text: r.award_title }));
  cert.append(el("p", { class: "center", text: "Awarded to" }));
  cert.append(el("div", { class: "cert-name", text: r.recipient_name }));
  if (r.citation) cert.append(el("p", { class: "center", text: r.citation }));
  const meta = [r.category_name, r.cycle, r.year].filter(Boolean).join(" · ");
  if (meta) cert.append(el("p", { class: "center", text: meta }));
  if (r.trust_statement) cert.append(el("p", { text: r.trust_statement }));
  if (r.panel_summary) cert.append(el("p", { text: r.panel_summary }));
  if (r.nominator_name) cert.append(el("p", { text: "Nominated by: " + r.nominator_name }));
  cert.append(el("p", { class: "center", text: "Seal serial: " + (r.seal_serial || "") + " · Issued: " + day(r.issued_at || r.created_at) }));
  printDoc(cert);
}



function note(node, text, cls = "muted") { node.className = cls; node.textContent = text; }

function msg(t) { $("#gateMsg").textContent = t || ""; }

async function loadIdentity() {
  me = session.user;
  const { data } = await sb.from("executive_memberships").select("role,active").eq("user_id", me.id).maybeSingle();
  role = data?.active ? data.role : null;
  $("#whoami").textContent = (me.email || me.id) + (role ? " · " + role : " · no executive role");
}

async function boot() {
  if (INITIAL_ERR) msg("That link could not be used: " + INITIAL_ERR.replace(/\+/g, " "));
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session && (INITIAL_TYPE === "invite" || INITIAL_TYPE === "recovery")) {
    $("#setpw").classList.remove("hide");
    $("#signin").classList.add("hide");
    $("#gateNote").textContent = "Your email is confirmed. Set a password to finish.";
    history.replaceState(null, "", location.pathname + location.search);
    return;
  }
  if (session) await enter();
}

async function enter() {
  // Every signed-in account can enter the dashboard shell.
  // Database RLS and individual API permissions remain authoritative for data/actions.
  await loadIdentity();
  $("#gate").classList.add("hide");
  $("#signout").classList.remove("hide");
  $("#tabs").classList.remove("hide");
  $("#app").classList.remove("hide");
  buildTabs();
  render("overview");
}

$("#signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

const TABS = [["overview", "Overview"], ["tasks", "Tasks"], ["funding", "Funding"],
  ["relationships", "Relationships"], ["appointments", "Appointments & correspondence"], ["agents", "Agents"], ["knowledge", "Knowledge"],
  ["research", "Research"], ["schedule", "Schedule"], ["awards", "Awards"], ["judging", "Judging"], ["certified", "Certified"], ["documents", "Documents"], ["account", "Account"]];
function buildTabs() {
  const nav = $("#tabs"); nav.textContent = "";
  for (const [id, label] of TABS) nav.append(el("button", { text: label, "aria-selected": String(id === "overview"), onclick: () => render(id) }));
}
function render(id) {
  currentTab = id;
  const label = (TABS.find(t => t[0] === id) || TABS[0])[1];
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.textContent === label)));
  const app = $("#app"); app.textContent = "";
  const fn = { overview, tasks, funding, relationships, appointments, agents, knowledge, research, schedule, awards, judging, certified, documents, account }[id] || overview;
  fn(app).catch(e => app.append(el("div", { class: "err", text: "Could not render: " + (e.message || e) })));
}
function card(title, kids) { return el("div", { class: "card" }, [el("h2", { text: title }), ...[].concat(kids)]); }
function table(headers, rows, empty) {
  if (!rows.length) return el("div", { class: "muted", text: empty || "Nothing recorded yet." });
  const t = el("table");
  t.append(el("tr", {}, headers.map(h => el("th", { text: h }))));
  for (const r of rows) t.append(el("tr", {}, r.map(c => el("td", {}, c))));
  return t;
}
function fail(node, e) { node.append(el("div", { class: "err", text: "Could not load: " + (e.message || e) })); }
function opts(list, value) { return list.map(([v, t]) => el("option", { value: v, text: t, selected: String(v) === String(value) ? "selected" : undefined })); }
function sel(values, current, onchange) { return el("select", { onchange }, opts(values, current)); }

async function patch(schema, tbl, id, body) {
  const q = schema === "executive" ? exec().from(tbl) : sb.from(tbl);
  const { error } = await q.update(body).eq("id", id);
  if (error) { alert(error.message); return false; }
  return true;
}
async function remove(schema, tbl, id) {
  if (!confirm("Delete this record?")) return;
  const q = schema === "executive" ? exec().from(tbl) : sb.from(tbl);
  const { error } = await q.delete().eq("id", id);
  if (error) return alert(error.message);
  render(currentTab);
}

const TASK_STATUS = [["open", "open"], ["in_progress", "in progress"], ["blocked", "blocked"], ["done", "done"], ["cancelled", "cancelled"]];
const OPPS_STATUS = [["researching", "researching"], ["qualified", "qualified"], ["preparing", "preparing"], ["submitted", "submitted"], ["follow_up", "follow up"], ["committed", "committed"], ["funded", "funded"], ["rejected", "rejected"], ["expired", "expired"]];
const OPP_CATS = [["grant", "grant"], ["investment", "investment"], ["sponsorship", "sponsorship"], ["partnership", "partnership"], ["other", "other"]];
const STAGES = [["identified", "identified"], ["researched", "researched"], ["contacted", "contacted"], ["engaged", "engaged"], ["meeting", "meeting"], ["committed", "committed"], ["dormant", "dormant"]];

async function overview(app) {
  const c = card("Executive position", el("div", { class: "metrics" }, [
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "verified received" })]),
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "remaining to objective" })]),
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "open tasks" })]),
    el("div", { class: "metric" }, [el("b", { text: "…" }), el("small", { text: "live opportunities" })])
  ]));
  app.append(c);

  const [rec, tk, op, dl, dec] = await Promise.all([
    exec().from("funding_received").select("*").maybeSingle(),
    exec().from("tasks").select("id,title,status,priority,due_at").neq("status", "done").order("priority").limit(8),
    sb.from("executive_opportunities").select("id,title,status,deadline_at,amount_estimate").not("status", "in", "(funded,rejected,expired)").order("deadline_at", { ascending: true, nullsFirst: false }).limit(8),
    exec().from("decisions").select("id,decision,decided_at,status").order("decided_at", { ascending: false }).limit(4),
    exec().from("funding_pipeline").select("*")
  ]);

  const received = Number(rec.data?.verified_received_usd ?? 0);
  const vals = [money(received), money(450000 - received), tk.data?.length ?? 0, op.data?.length ?? 0];
  c.querySelectorAll(".metric b").forEach((b, i) => b.textContent = vals[i]);
  app.append(el("div", { class: "muted", text: "Objective: $450,000 in verified, received capital. Only cleared funds are counted." }));

  if (dl.error || tk.error || op.error) {
    const e = dl.error || tk.error || op.error;
    app.append(el("div", { class: "err", text: "Some records could not be read: " + e.message }));
  }

  const grid = el("div", { class: "grid2" });
  grid.append(card("Next tasks", table(["task", "status", "due"],
    (tk.data || []).map(t => [t.title, el("span", { class: "tag", text: t.status }), day(t.due_at)]), "No open tasks.")));
  grid.append(card("Nearest deadlines", table(["opportunity", "status", "deadline"],
    (op.data || []).map(o => {
      const d = o.deadline_at ? days(o.deadline_at) : null;
      const tag = d === null ? "" : (d < 0 ? el("span", { class: "tag hot", text: "expired" }) : d <= 14 ? el("span", { class: "tag hot", text: d + " days" }) : el("span", { class: "tag", text: d + " days" }));
      return [o.title, el("span", { class: "tag", text: o.status }), el("div", {}, [day(o.deadline_at), " ", tag])];
    }), "No live opportunities.")));
  app.append(grid);

  // Server-side scheduler refreshes these persisted alerts every 30 minutes.
  const alertBox = card("Scheduled task deadline watch", el("div", {class:"muted",text:"Loading deadline alerts…"}));
  app.append(alertBox);
  const alerts = await exec().from("deadline_alerts")
    .select("task_id,severity,due_at").is("resolved_at",null)
    .order("due_at",{ascending:true}).limit(20);
  alertBox.textContent = "";
  alertBox.append(el("h2",{text:"Scheduled task deadline watch"}));
  if(alerts.error) {
    fail(alertBox,alerts.error);
  } else {
    const ids = (alerts.data || []).map(a=>a.task_id);
    let titles = new Map();
    if(ids.length) {
      const taskNames=await exec().from("tasks").select("id,title,status").in("id",ids);
      if(taskNames.error) fail(alertBox,taskNames.error);
      else titles=new Map((taskNames.data||[]).map(t=>[t.id,t.title]));
    }
    alertBox.append(table(["task","severity","due date"],(alerts.data||[]).map(a=>[
      titles.get(a.task_id)||"Task "+a.task_id.slice(0,8),
      el("span",{class:a.severity==="overdue"?"tag hot":"tag",text:a.severity}),
      day(a.due_at)
    ]),"No tasks due within 72 hours or overdue."));
    const run = await exec().from("scheduler_runs")
      .select("ran_at,refreshed").order("ran_at",{ascending:false}).limit(1).maybeSingle();
    const lastRun = run.error ? "Run history unavailable: " + run.error.message
      : run.data ? "Last scheduled run: " + new Date(run.data.ran_at).toLocaleString() +
          " · " + run.data.refreshed + " task alerts reviewed"
      : "Awaiting the first verified scheduled execution.";
    alertBox.append(el("div",{class:"muted",text:lastRun}));
  }
  app.append(card("Recent decisions", table(["decision", "status", "when"],
    (dec.data || []).map(d => [d.decision, d.status, day(d.decided_at)]), "No decisions recorded.")));
}

async function tasks(app) {
  const box = card("Tasks", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const { data, error } = await exec().from("tasks").select("id,title,detail,status,priority,owner_agent,due_at,blocked_on").order("priority").limit(200);
  box.textContent = ""; box.append(el("h2", { text: "Tasks" }));
  if (error) return fail(box, error);
  box.append(table(["task", "owner", "status", "priority", "due", ""], (data || []).map(t => [
    el("div", {}, [el("div", { text: t.title }), t.blocked_on ? el("div", { class: "muted", text: "blocked: " + t.blocked_on }) : null]),
    s(t.owner_agent) || "unassigned",

const APPOINTMENT_STATES = [["scheduled","scheduled"],["completed","completed"],["rescheduled","rescheduled"],["cancelled","cancelled"]];
const CORRESPONDENCE_CHANNELS = [["email","email"],["phone","phone"],["meeting","meeting"],["video","video"],["message","message"],["letter","letter"],["other","other"]];
const CORRESPONDENCE_DIRECTIONS = [["outbound","outbound"],["inbound","inbound"],["internal","internal"]];
function textSearch(v) { return String(v || "").toLocaleLowerCase().trim(); }
function safeDatetime(s) {
  if (!s) return null;
  const date = new Date(s);
  return Number.isFinite(date.getTime()) ? date.toISOString() : null;
}
function relationshipOptions(rows, label) {
  return [el("option",{value:"",text:label})].concat(rows.map(item=>
    el("option",{value:item.id,text:item.name || item.full_name})));
}
function fmtDateTime(value) { return value ? new Date(value).toLocaleString() : "—"; }

async function appointments(app) {
  app.append(card("Appointments and correspondence",
    el("div",{class:"muted",text:"Search meetings, correspondence, and follow-ups by person or company. Records are stored in the executive database."})));
  const loading = card("Timeline",el("div",{class:"muted",text:"Loading appointments and interactions…"}));
  app.append(loading);
  const [orgRes, peopleRes, appointmentRes, commRes] = await Promise.all([
    exec().from("organizations").select("id,name").order("name").limit(1000),
    exec().from("people").select("id,full_name,organization_id").order("full_name").limit(1000),
    exec().from("appointments").select("id,title,person_id,organization_id,starts_at,ends_at,location,meeting_link,agenda,notes,status,outcome,follow_up_at").order("starts_at",{ascending:false}).limit(1000),
    exec().from("communications").select("id,person_id,organization_id,channel,direction,subject,summary,occurred_at").order("occurred_at",{ascending:false}).limit(1000)
  ]);
  loading.remove();
  const error = [orgRes,peopleRes,appointmentRes,commRes].find(r=>r.error)?.error;
  if (error) return app.append(card("Records unavailable",el("div",{class:"err",text:error.message})));
  const orgs=orgRes.data || [], ppl=peopleRes.data || [];
  const appts=appointmentRes.data || [], communications=commRes.data || [];
  const orgById = new Map(orgs.map(o=>[o.id,o]));
  const personById = new Map(ppl.map(p=>[p.id,p]));
  const orgIdFor = r => r.organization_id || personById.get(r.person_id)?.organization_id || null;
  const personName = r => personById.get(r.person_id)?.full_name || "—";
  const companyName = r => orgById.get(orgIdFor(r))?.name || "—";
  const selectPerson = id => el("select",{id},relationshipOptions(ppl,"Select person (optional)"));
  const selectOrg = id => el("select",{id},relationshipOptions(orgs,"Select company (optional)"));

  const search = el("input",{placeholder:"Search individual, company, subject or notes", "aria-label":"Search appointments and correspondence",style:"flex:1;min-width:220px"});
  const companyFilter=selectOrg("timelineCompany");
  const personFilter=selectPerson("timelinePerson");
  const kindFilter=el("select",{"aria-label":"Record type"},[
    el("option",{value:"all",text:"All records"}),
    el("option",{value:"appointment",text:"Appointments"}),
    el("option",{value:"correspondence",text:"Correspondence"})
  ]);
  const timelineBody=el("div",{});
  const panel=card("Search records",[
    el("div",{class:"row"},[search,personFilter,companyFilter,kindFilter]),
    el("div",{class:"muted",text:"Filters work together. Company filtering also includes correspondence linked to employees at that company."}),
    timelineBody
  ]);
  app.append(panel);
  function matches(r,type) {
    if(kindFilter.value!=="all" && kindFilter.value!==type)return false;
    if(personFilter.value && r.person_id!==personFilter.value)return false;
    if(companyFilter.value && orgIdFor(r)!==companyFilter.value)return false;
    const term=textSearch(search.value);
    if(!term)return true;
    return [personName(r),companyName(r),r.title,r.subject,r.summary,r.notes,r.agenda,r.outcome,r.location]
      .some(v=>textSearch(v).includes(term));
  }
  function drawTimeline() {
    timelineBody.textContent="";
    const rows = [
      ...appts.filter(a=>matches(a,"appointment")).map(a=>({type:"appointment",date:a.starts_at,record:a})),
      ...communications.filter(c=>matches(c,"correspondence")).map(c=>({type:"correspondence",date:c.occurred_at,record:c}))
    ].sort((a,b)=>(new Date(b.date||0))-(new Date(a.date||0)));
    timelineBody.append(el("div",{class:"muted",style:"margin-top:12px",
      text:rows.length+" matching records (up to 1,000 recent records of each type loaded)."}));
    if(!rows.length)return timelineBody.append(el("div",{class:"muted",text:"No records match these filters."}));
    const records=rows.slice(0,300).map(({type,record:r,date})=>{
      const description=type==="appointment" ? (r.agenda||r.notes||r.outcome||"") : (r.summary||"");
      const line=el("div",{class:"card",style:"margin-top:9px"},[
        el("div",{class:"row"},[
          el("span",{class:"tag",text:type}),
          el("strong",{text:r.title||r.subject||"(Untitled record)"}),
          el("span",{class:"muted",text:fmtDateTime(date)})
        ]),
        el("div",{class:"muted",text:"Person: "+personName(r)+" · Company: "+companyName(r)}),
        el("div",{class:"muted",text:type==="appointment"
          ? "Status: "+r.status+(r.location?" · "+r.location:"")+(r.follow_up_at?" · Follow up "+fmtDateTime(r.follow_up_at):"")
          : r.direction+" / "+r.channel}),
        ...(description?[el("div",{style:"white-space:pre-wrap",text:description})]:[])
      ]);
      if(type==="appointment" && canWrite()) {
        const state=sel(APPOINTMENT_STATES,r.status,async ev=>{
          if(await patch("executive","appointments",r.id,{status:ev.target.value})) render("appointments");
        });
        line.append(el("div",{class:"row",style:"margin-top:9px"},[
          el("span",{class:"muted",text:"Update status:"}),state,
          el("button",{class:"mini",text:"Edit notes / outcome",onclick:async()=>{
            const notes=prompt("Appointment notes",r.notes||"");if(notes===null)return;
            const outcome=prompt("Appointment outcome",r.outcome||"");if(outcome===null)return;
            if(await patch("executive","appointments",r.id,{notes,outcome}))render("appointments");
          }})
        ]));
      }
      if(canManage())line.append(el("button",{class:"mini ghost",style:"margin-top:8px",text:"Delete",onclick:()=>remove("executive",type==="appointment"?"appointments":"communications",r.id)}));
      return line;
    });
    timelineBody.append(...records);
    if(rows.length>300)timelineBody.append(el("div",{class:"muted",text:"Showing 300 results. Refine your filters to narrow the list."}));
  }
  [search,personFilter,companyFilter,kindFilter].forEach(x=>x.addEventListener(x===search?"input":"change",drawTimeline));
  drawTimeline();

  if(!canWrite()) {
    app.append(card("Record access",el("div",{class:"muted",text:"Viewing is available to authorized readers. Recording appointments and correspondence requires write access."})));
    return;
  }
  const appointmentPerson=selectPerson("apptPerson");
  const appointmentOrg=selectOrg("apptOrg");
  const appointmentTitle=el("input",{placeholder:"Appointment title",style:"min-width:200px"});
  const appointmentStart=el("input",{type:"datetime-local","aria-label":"Appointment start"});
  const appointmentEnd=el("input",{type:"datetime-local","aria-label":"Appointment end"});
  const appointmentLocation=el("input",{placeholder:"Location or meeting link",style:"min-width:200px"});
  const appointmentAgenda=el("textarea",{placeholder:"Agenda and preparation notes",rows:3,style:"width:100%"});
  const appointmentFollowup=el("input",{type:"datetime-local","aria-label":"Follow-up date and time"});
  const appointmentStatus=el("select",{},opts(APPOINTMENT_STATES,"scheduled"));
  const appointmentFeedback=el("div",{class:"err","aria-live":"polite"});
  app.append(card("Record an appointment",[
    el("div",{class:"row"},[appointmentTitle,appointmentPerson,appointmentOrg]),
    el("div",{class:"row",style:"margin-top:9px"},[
      el("label",{},["Starts ",appointmentStart]),el("label",{},["Ends ",appointmentEnd]),
      el("label",{},["Follow-up ",appointmentFollowup]),appointmentStatus
    ]),
    el("div",{class:"row",style:"margin-top:9px"},[appointmentLocation]),
    appointmentAgenda,
    el("button",{class:"primary",text:"Save appointment",onclick:async()=>{
      const title=appointmentTitle.value.trim();
      const starts=safeDatetime(appointmentStart.value),ends=safeDatetime(appointmentEnd.value);
      if(!title || !starts) return note(appointmentFeedback,"Title and appointment start are required.","err");
      if(ends && ends<=starts)return note(appointmentFeedback,"End must be later than start.","err");
      if(!appointmentPerson.value && !appointmentOrg.value)
        return note(appointmentFeedback,"Select an individual or company.","err");
      const inferredOrg=personById.get(appointmentPerson.value)?.organization_id;
      const {error}=await exec().from("appointments").insert({
        title,starts_at:starts,ends_at:ends,
        person_id:appointmentPerson.value||null,
        organization_id:appointmentOrg.value||inferredOrg||null,
        location:appointmentLocation.value.trim()||null,
        agenda:appointmentAgenda.value.trim()||null,
        follow_up_at:safeDatetime(appointmentFollowup.value),
        status:appointmentStatus.value
      });
      if(error)return note(appointmentFeedback,error.message,"err");
      render("appointments");
    }}),appointmentFeedback
  ]));

  const correspondencePerson=selectPerson("corrPerson");
  const correspondenceOrg=selectOrg("corrOrg");
  const correspondenceSubject=el("input",{placeholder:"Subject",style:"min-width:220px"});
  const correspondenceChannel=el("select",{},opts(CORRESPONDENCE_CHANNELS,"email"));
  const correspondenceDirection=el("select",{},opts(CORRESPONDENCE_DIRECTIONS,"outbound"));
  const correspondenceDate=el("input",{type:"datetime-local","aria-label":"Correspondence date"});
  const correspondenceBody=el("textarea",{placeholder:"Summary, transcript, or interaction notes",rows:4,style:"width:100%"});
  const correspondenceFeedback=el("div",{class:"err","aria-live":"polite"});
  app.append(card("Record correspondence",[
    el("div",{class:"row"},[correspondenceSubject,correspondencePerson,correspondenceOrg]),
    el("div",{class:"row",style:"margin-top:9px"},[correspondenceChannel,correspondenceDirection,
      el("label",{},["Occurred ",correspondenceDate])]),
    correspondenceBody,
    el("button",{class:"primary",text:"Save correspondence",onclick:async()=>{
      if(!correspondencePerson.value && !correspondenceOrg.value)
        return note(correspondenceFeedback,"Select an individual or company.","err");
      const subject=correspondenceSubject.value.trim();
      const summary=correspondenceBody.value.trim();
      if(!subject && !summary)return note(correspondenceFeedback,"Enter a subject or summary.","err");
      const inferredOrg=personById.get(correspondencePerson.value)?.organization_id;
      const {error}=await exec().from("communications").insert({
        person_id:correspondencePerson.value||null,
        organization_id:correspondenceOrg.value||inferredOrg||null,
        channel:correspondenceChannel.value,
        direction:correspondenceDirection.value,
        subject:subject||null,summary:summary||null,
        occurred_at:safeDatetime(correspondenceDate.value)||new Date().toISOString()
      });
      if(error)return note(correspondenceFeedback,error.message,"err");
      render("appointments");
    }}),correspondenceFeedback
  ]));
}

async function executiveDocumentRequest(path, init = {}) {
  const {data,error} = await sb.auth.getSession();

  if (error || !fresh?.access_token) throw new Error("Executive session expired; please sign in again.");
  if (!role || !["owner", "admin"].includes(role)) throw new Error("An active executive document role is required.");
  session = fresh;
  return fetch(WORKER + path, {
    ...init,
    headers: {Authorization: "Bearer " + fresh.access_token, ...(init.headers || {})}
  });
}

async function testDocuments(statusNode, btn) {
  note(statusNode, "Running authenticated R2 access test…");
  btn.disabled = true;
  const lines = [];
  const key = "diagnostics/roundtrip-" + crypto.randomUUID() + ".txt";
  const endpoint = "/v1/documents/" + encodeURIComponent(key);
  const payload = "round trip " + new Date().toISOString();
  let uploaded = false;
  let passed = true;
  try {
    const listing = await executiveDocumentRequest("/v1/documents");
    if (listing.status !== 200) throw new Error("Initial listing HTTP " + listing.status);
    lines.push("Initial document list: passed");
    const upload = await executiveDocumentRequest(endpoint, {
      method: "PUT", headers: {"content-type": "text/plain"}, body: payload
    });
    if (upload.status !== 201) throw new Error("Upload HTTP " + upload.status);
    uploaded = true;
    lines.push("Upload: passed");
    const prefix = await executiveDocumentRequest("/v1/documents?prefix=diagnostics");
    if (prefix.status !== 200) throw new Error("Prefix list HTTP " + prefix.status);
    const result = await prefix.json();
    if (!Array.isArray(result?.objects) || !result.objects.some(o => o.name === key))
      throw new Error("Uploaded document not listed");
    lines.push("Prefix listing: passed");
    const read = await executiveDocumentRequest(endpoint);
    if (read.status !== 200 || (await read.text()) !== payload)
      throw new Error("Download integrity check failed");
    lines.push("Download integrity: passed");
  } catch (error) {
    passed = false;
    lines.push("ERROR: " + (error.message || String(error)));
  } finally {
    if (uploaded) {
      try {
        const deletion = await executiveDocumentRequest(endpoint, {method: "DELETE"});
        if (deletion.status !== 200) throw new Error("Deletion HTTP " + deletion.status);
        const gone = await executiveDocumentRequest(endpoint);
        if (gone.status !== 404) throw new Error("Object remains after deletion, HTTP " + gone.status);
        lines.push("Delete and 404 verification: passed");
      } catch (error) {
        passed = false;
        lines.push("CLEANUP FAILED: " + (error.message || String(error)) + "; key: " + key);
      }
    }
    btn.disabled = false;
    note(statusNode, (passed ? "Authenticated access test passed.\\n" : "Access test failed.\\n") +
      lines.join("\\n"), passed ? "ok" : "err");
  }
}

  if (canWrite() && cats?.length) {
    nbox.append(el("div", { class: "row", style: "margin-top:14px" }, [
      el("select", { id: "nCat" }, cats.map(c => el("option", { value: c.id, text: c.name }))),
      el("input", { id: "nName", placeholder: "Nominee name" }),
      el("select", { id: "nType" }, ["platform", "business", "individual", "agent", "technology"].map(v => el("option", { value: v, text: v }))),
      el("input", { id: "nBy", placeholder: "Nominator" }),
      el("button", { class: "primary", text: "Nominate", onclick: async () => {
        const nominee = $("#nName").value.trim(); if (!nominee) return;
        const cat = catById[$("#nCat").value];
        const { error } = await exec().from("submissions").insert({
          category_id: cat.id, category_name: cat.name, nominee_name: nominee,
          nominee_type: $("#nType").value, nominator_name: $("#nBy").value.trim() || null,
          summary: $("#nSummary").value.trim() || null
        });
        if (error) return alert(error.message);
        render("awards");
      } })
    ]));
    nbox.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "nSummary", placeholder: "Why this nominee? (summary)", style: "min-width:420px" })
    ]));
  }
}

async function judging(app) {
  if (!canManage()) {
    app.append(card("Judging", el("div", { class: "muted", text: "Judging criteria, judgments, and criteria change requests are board data. They are restricted to owner and admin accounts, in the database as well as here." })));
    return;
  }
  const { data: cats } = await exec().from("award_categories").select("id,name").order("sort_order").order("name");
  const catById = Object.fromEntries((cats || []).map(c => [c.id, c]));

  const cbox = card("Judging criteria — board only", el("div", { class: "muted", text: "Loading…" }));
  app.append(cbox);
  const critHost = el("div", { style: "margin-top:12px" });
  async function loadCriteria() {
    critHost.textContent = "";
    const catId = $("#jCat")?.value; if (!catId) return;
    const { data, error } = await exec().from("judging_criteria")
      .select("name,max_points,definition,sort_order").eq("category_id", catId).order("sort_order").limit(100);
    if (error) return fail(critHost, error);
    critHost.append(table(["criterion", "max points", "definition"],
      (data || []).map(c => [c.name, c.max_points, s(c.definition || "")]), "No criteria for this category yet."));
  }
  cbox.textContent = ""; cbox.append(el("h2", { text: "Judging criteria — board only" }));
  if (!cats?.length) cbox.append(el("div", { class: "muted", text: "Create an award category first." }));
  else {
    cbox.append(el("div", { class: "row" }, [
      el("select", { id: "jCat", onchange: loadCriteria }, cats.map(c => el("option", { value: c.id, text: c.name })))
    ]));
    cbox.append(critHost);
    await loadCriteria();
    cbox.append(el("div", { class: "row", style: "margin-top:14px" }, [
      el("input", { id: "jcName", placeholder: "Criterion name" }),
      el("input", { id: "jcMax", type: "number", value: "25", style: "width:90px" }),
      el("input", { id: "jcDef", placeholder: "Definition", style: "min-width:280px" }),
      el("button", { class: "primary", text: "Add criterion", onclick: async () => {
        const name = $("#jcName").value.trim(); if (!name) return;
        const { error } = await exec().from("judging_criteria").insert({
          category_id: $("#jCat").value, name, max_points: Number($("#jcMax").value) || 25,
          definition: $("#jcDef").value.trim() || null
        });
        if (error) return alert(error.message);
        render("judging");
      } })
    ]));
  }

  const runbox = card("Run the judge — board only", el("div", { class: "muted", text: "Loading…" }));
  app.append(runbox);
  const { data: allSubs } = await exec().from("submissions").select("id,nominee_name,status").limit(200);
  runbox.textContent = ""; runbox.append(el("h2", { text: "Run the judge — board only" }));
  const judgeable = (allSubs || []).filter(s => ["submitted", "screened"].includes(s.status));
  if (!judgeable.length) runbox.append(el("div", { class: "muted", text: "No submissions awaiting judging." }));
  else {
    runbox.append(el("div", { class: "row" }, [
      el("select", { id: "judgeSub" }, judgeable.map(s => el("option", { value: s.id, text: s.nominee_name + " (" + s.status + ")" }))),
      el("button", { class: "primary", text: "Judge submission", onclick: async (ev) => {
        ev.target.disabled = true;
        const rr = await workerFetch("/v1/judge", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ submission_id: $("#judgeSub").value }) });
        const jj = await rr.json().catch(() => ({}));
        if (!rr.ok) { alert(jj.error || ("HTTP " + rr.status)); ev.target.disabled = false; return; }
        alert("Draft judgment recorded: " + jj.judgment.total_points + " / " + jj.judgment.max_points + " (" + jj.judgment.percentage + "%) — " + jj.judgment.recommendation +
          (jj.criteria_change_requests ? " The judge also filed " + jj.criteria_change_requests + " criteria change request(s) for the board to decide." : ""));
        render("judging");
      } })
    ]));
    runbox.append(el("div", { class: "muted", style: "margin-top:8px", text: "The judge scores against the category's private criteria and writes a draft judgment for the board to approve or overrule. It can never change a criterion — it files a change request instead." }));
  }

  const jbox = card("Judgments — board only", el("div", { class: "muted", text: "Loading…" }));
  app.append(jbox);
  const [{ data: judgments, error: je }, { data: subs }] = await Promise.all([
    exec().from("judgments").select("id,submission_id,category_id,recommendation,total_points,max_points,percentage,status,judged_at").order("created_at", { ascending: false }).limit(100),
    exec().from("submissions").select("id,nominee_name").limit(200)
  ]);
  const subById = Object.fromEntries((subs || []).map(s => [s.id, s]));
  jbox.textContent = ""; jbox.append(el("h2", { text: "Judgments — board only" }));
  if (je) fail(jbox, je);
  else jbox.append(table(["nominee", "category", "recommendation", "points", "%", "status", ""],
    (judgments || []).map(j => [
      s(subById[j.submission_id]?.nominee_name || ""), s(catById[j.category_id]?.name || ""),
      s(j.recommendation || ""), j.total_points != null ? (j.total_points + " / " + (j.max_points ?? "")) : "",
      j.percentage ?? "", j.status,
      el("div", { class: "row" }, [
        el("button", { text: "Print score sheet", onclick: () => printScoreSheet(j.id, subById, catById) }),
        ...(j.status === "draft" ? [
          el("button", { text: "Approve", onclick: async () => {
            const { error } = await exec().from("judgments").update({ status: "approved" }).eq("id", j.id);
            if (error) return alert(error.message);
            render("judging");
          } }),
          el("button", { text: "Overrule", onclick: async () => {
            const note = prompt("Admin note for the overrule:"); if (note === null) return;
            const { error } = await exec().from("judgments").update({ status: "overridden", admin_note: note }).eq("id", j.id);
            if (error) return alert(error.message);
            render("judging");
          } })
        ] : [])
      ])
    ]), "No judgments yet. Judgments are produced by the judge agent (Phase 2) or recorded by the board."));

  const rbox = card("Criteria change requests — board only", el("div", { class: "muted", text: "Loading…" }));
  app.append(rbox);
  const { data: reqs, error: re } = await exec().from("criteria_change_requests")
    .select("id,criterion_name,current_definition,proposed_definition,purpose,status,created_at").order("created_at", { ascending: false }).limit(100);
  rbox.textContent = ""; rbox.append(el("h2", { text: "Criteria change requests — board only" }));
  if (re) fail(rbox, re);
  else rbox.append(table(["criterion", "proposed change", "purpose", "status", ""],
    (reqs || []).map(r => [
      r.criterion_name, s(r.proposed_definition || ""), s(r.purpose || ""), r.status,
      r.status === "pending_review" ? el("div", { class: "row" }, [
        el("button", { text: "Approve", onclick: async () => {
          const { error } = await exec().from("criteria_change_requests").update({ status: "approved", decided_at: new Date().toISOString() }).eq("id", r.id);
          if (error) return alert(error.message);
          render("judging");
        } }),
        el("button", { text: "Reject", onclick: async () => {
          const note = prompt("Admin note (optional):"); if (note === null) return;
          const { error } = await exec().from("criteria_change_requests").update({ status: "rejected", admin_note: note || null, decided_at: new Date().toISOString() }).eq("id", r.id);
          if (error) return alert(error.message);
          render("judging");
        } })
      ]) : ""
    ]), "No change requests. The judge agent must file one here before any criterion definition changes."));
}

async function certified(app) {
  const box = card("Certified register", el("div", { class: "muted", text: "Loading…" }));
  app.append(box);
  const [{ data, error }, { data: cats }] = await Promise.all([
    exec().from("certified_records").select("id,category_name,award_title,recipient_name,recipient_type,seal_serial,status,issued_at").order("issued_at", { ascending: false, nullsFirst: false }).limit(100),
    exec().from("award_categories").select("id,name").order("name")
  ]);
  box.textContent = ""; box.append(el("h2", { text: "Certified register" }));
  if (error) fail(box, error);
  else box.append(table(["recipient", "award", "category", "seal serial", "status", "issued", ""],
    (data || []).map(r => [r.recipient_name, s(r.award_title || ""), s(r.category_name || ""), s(r.seal_serial || ""), r.status, day(r.issued_at),
      r.status === "issued" ? el("button", { text: "Print certificate", onclick: () => printCertificate(r.id) }) : ""]),
    "No certified records issued yet."));
  if (canManage()) {
    box.append(el("div", { class: "muted", style: "margin-top:14px", text: "Issue a certified record (the seal serial must be unique)" }));
    box.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "rName", placeholder: "Recipient name" }),
      el("input", { id: "rAward", placeholder: "Award title" }),
      el("select", { id: "rCat" }, [el("option", { value: "", text: "No category" }), ...(cats || []).map(c => el("option", { value: c.id, text: c.name }))]),
      el("input", { id: "rSerial", placeholder: "Seal serial" }),
      el("button", { class: "primary", text: "Issue", onclick: async () => {
        const name = $("#rName").value.trim(); if (!name) return;
        const cat = (cats || []).find(c => c.id === $("#rCat").value);
        const { error } = await exec().from("certified_records").insert({
          recipient_name: name, award_title: $("#rAward").value.trim() || null,
          category_id: cat ? cat.id : null, category_name: cat ? cat.name : null,
          seal_serial: $("#rSerial").value.trim() || null,
          citation: $("#rCitation").value.trim() || null,
          status: "issued", issued_at: new Date().toISOString()
        });
        if (error) return alert(error.message);
        render("certified");
      } })
    ]));
    box.append(el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", { id: "rCitation", placeholder: "Citation", style: "min-width:420px" })
    ]));
  }
}

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") { $("#setpw").classList.remove("hide"); $("#gate").classList.remove("hide"); }
});
await boot();
</script>
